<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multi-Tenant Salon SaaS - Smart Queue Launcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { DEFAULT: '#f59e0b', dark: '#d97706', light: '#fbbf24' } } } }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .modal-enter { animation: fadeInScale 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body class="bg-slate-950 text-neutral-100 min-h-screen p-4 sm:p-6 md:p-8 flex flex-col justify-between">

  <div class="max-w-md mx-auto w-full my-auto space-y-6 pt-4 sm:pt-0">
    <div class="text-center space-y-2">
      <div class="inline-block bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-widest">
        Multi-Tenant Salon SaaS
      </div>
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white">Smart Salon System</h1>
      <p class="text-xs sm:text-sm text-neutral-400 max-w-sm mx-auto">
        Enter your salon name and security PIN below to register, launch or sign in to your digital queue and counter system.
      </p>
    </div>

    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-4 modal-enter">
      <form onsubmit="handleLaunch(event)" class="space-y-4">
        <div>
          <label class="text-xs text-neutral-400 block mb-1.5 font-bold uppercase tracking-wider">Salon Name</label>
          <input id="salonNameInput" type="text" placeholder="e.g. Deluxe Salon" oninput="updateSlug()" class="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 rounded-xl px-4 py-3 text-sm text-white focus:outline-none placeholder:text-neutral-600" required>
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1.5 font-bold uppercase tracking-wider">Security PIN (Min 4 Digits)</label>
          <input id="salonPinInput" type="password" maxlength="8" placeholder="Enter PIN" class="w-full bg-neutral-950 border border-neutral-800 focus:border-amber-400 rounded-xl px-4 py-3 text-center tracking-widest text-lg font-mono text-amber-400 focus:outline-none placeholder:text-xs placeholder:tracking-normal placeholder:text-neutral-600" required>
        </div>

        <div class="text-[11px] text-neutral-500 font-mono">
          System ID Slug: <span id="slugPreview" class="text-amber-400 font-bold">--</span>
        </div>

        <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 active:scale-[0.98] text-slate-950 font-black text-sm py-3.5 rounded-xl transition-all shadow-lg cursor-pointer">
          🚀 Launch / Register My Salon →
        </button>
        <p id="launcherError" class="text-xs text-red-400 font-semibold min-h-[16px] text-center"></p>
      </form>
    </div>

    <div class="text-center">
      <a href="super-admin.html" class="text-xs text-neutral-500 hover:text-amber-400 font-semibold transition-all">
        🛡️ Access Super Admin Cockpit
      </a>
    </div>
  </div>

  <footer class="w-full py-4 text-center text-xs text-neutral-500 border-t border-neutral-900 mt-6">
    <span>© 2026 Smart Salon SaaS • Multi-Tenant Queue Engine</span>
  </footer>

  <script>
    const API_BASE = "https://luxe-salon-saas.onrender.com/api";

    function updateSlug() {
      const val = document.getElementById('salonNameInput').value.trim();
      const slug = val ? val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') : '--';
      document.getElementById('slugPreview').innerText = slug;
    }

    async function handleLaunch(e) {
      e.preventDefault();
      const name = document.getElementById('salonNameInput').value.trim();
      const pin = document.getElementById('salonPinInput').value.trim();
      const errBox = document.getElementById('launcherError');
      errBox.innerText = '';

      if (!name) { errBox.innerText = 'Please enter salon name.'; return; }
      if (!pin || pin.length < 4) { errBox.innerText = 'PIN must be at least 4 digits.'; return; }

      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

      try {
        const res = await fetch(`${API_BASE}/${slug}/auth/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: pin })
        });
        const data = await res.json();

        if (data.status === 'FIRST_TIME') {
          const setRes = await fetch(`${API_BASE}/${slug}/auth/set-passcode`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ newPasscode: pin, shopName: name })
          });
          const setData = await setRes.json();
          if (!setData.success) {
            errBox.innerText = setData.error || 'Failed to register salon.';
            return;
          }
        } else if (res.status === 401) {
          errBox.innerText = 'Incorrect PIN for existing salon.';
          return;
        }

        try { confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } }); } catch(e){}
        setTimeout(() => {
          window.location.href = `owner.html?salon=${slug}`;
        }, 500);

      } catch (e) {
        errBox.innerText = 'Connection error. Please try again.';
      }
    }
  </script>
</body>
</html>
